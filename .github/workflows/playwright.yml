name: OrangeHRM E2E CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Playwright UI E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:8080
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SERVER_MODE: docker
      WAIT_TIMEOUT_MS: 180000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start OrangeHRM Docker
        run: docker compose -f docker-compose.orangehrm.yml up -d --force-recreate

      - name: Wait for OrangeHRM Readiness
        run: |
          echo "Waiting for OrangeHRM login page..."
          for i in {1..90}; do
            STATUS=$(curl -L --max-time 10 -s -o /dev/null -w "%{http_code}" http://localhost:8080/web/index.php/auth/login || echo "000")

            if [ "$STATUS" = "200" ]; then
              echo "OrangeHRM is ready."
              exit 0
            fi

            echo "Status: $STATUS. Waiting 5 seconds... ($i/90)"
            sleep 5
          done

          echo "OrangeHRM did not become ready."
          echo "Docker containers:"
          docker compose -f docker-compose.orangehrm.yml ps
          echo "OrangeHRM logs:"
          docker compose -f docker-compose.orangehrm.yml logs orangehrm --tail=200
          echo "DB logs:"
          docker compose -f docker-compose.orangehrm.yml logs db --tail=200
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Format Check
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Playwright Tests
        run: pnpm test

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangehrm-playwright-artifacts
          path: |
            playwright-report/
            test-results/
            reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Show Docker Logs on Failure
        if: failure()
        run: |
          docker compose -f docker-compose.orangehrm.yml ps
          docker compose -f docker-compose.orangehrm.yml logs orangehrm --tail=200
          docker compose -f docker-compose.orangehrm.yml logs db --tail=200

      - name: Stop OrangeHRM Docker
        if: always()
        run: docker compose -f docker-compose.orangehrm.yml down -v --remove-orphans