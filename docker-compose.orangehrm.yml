version: '3.8'

services:
  db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ohrm
      MYSQL_USER: ohrm
      MYSQL_PASSWORD: ohrm
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  orangehrm:
    image: orangehrm/orangehrm:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 🛡️ THE FIX: Using the strictly required Official Docker variables for OrangeHRM
      ORANGEHRM_DATABASE_HOST: db
      ORANGEHRM_DATABASE_PORT: 3306
      ORANGEHRM_DATABASE_NAME: ohrm
      ORANGEHRM_DATABASE_USER: ohrm
      ORANGEHRM_DATABASE_PASSWORD: ohrm
    ports:
      - "8080:80"
    restart: on-failure