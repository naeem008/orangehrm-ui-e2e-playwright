services:
  db:
    image: mariadb:10.4.30
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ohrm
      MARIADB_USER: ohrm
      MARIADB_PASSWORD: ohrm
    volumes:
      - orangehrm_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 30

  orangehrm:
    image: orangehrm/orangehrm:5.8
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORANGEHRM_DATABASE_HOST: db
      ORANGEHRM_DATABASE_PORT: 3306
      ORANGEHRM_DATABASE_NAME: ohrm
      ORANGEHRM_DATABASE_USER: ohrm
      ORANGEHRM_DATABASE_PASSWORD: ohrm
    volumes:
      - ./docker/orangehrm/Conf.php:/var/www/html/lib/confs/Conf.php:ro
    ports:
      - "8080:80"
    restart: on-failure

volumes:
  orangehrm_db_data: