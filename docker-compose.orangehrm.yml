version: '3.8'

services:
  db:
    # 🛡️ THE FIX: Switched from mysql:5.7 to mariadb to match your local XAMPP setup
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ohrm
      MYSQL_USER: ohrm
      MYSQL_PASSWORD: ohrm
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  orangehrm:
    image: orangehrm/orangehrm:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Reverted to your original standard variables to ensure connection
      DB_HOST: db
      DB_NAME: ohrm
      DB_USER: ohrm
      DB_PASSWORD: ohrm
    ports:
      - "8080:80"
    restart: on-failure