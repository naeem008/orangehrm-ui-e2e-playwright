version: '3.8'

services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ohrm
      MYSQL_USER: ohrm
      MYSQL_PASSWORD: ohrm
    ports:
      - "3306:3306"
    volumes:
      # 🛡️ SENIOR MOVE: Mount your local DB dump to auto-seed the CI database on boot
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # 🛡️ FIX: Added credentials so the ping actually works inside the container
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  orangehrm:
    image: orangehrm/orangehrm:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Standard variables for OrangeHRM docker connections
      ORANGEHRM_DATABASE_HOST: db
      ORANGEHRM_DATABASE_USER: ohrm
      ORANGEHRM_DATABASE_PASSWORD: ohrm
      ORANGEHRM_DATABASE_NAME: ohrm
    ports:
      - "8080:80"
    restart: on-failure